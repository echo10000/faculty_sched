{% if page_obj.has_other_pages %}<nav aria-label="Pagination" class="d-flex flex-wrap gap-2 align-items-center justify-content-between mt-3"><span class="small text-secondary">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div class="d-flex gap-2">{% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page_obj.previous_page_number }}&amp;{% if page_query %}{{ page_query }}{% else %}q={{ query|urlencode }}{% endif %}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page_obj.next_page_number }}&amp;{% if page_query %}{{ page_query }}{% else %}q={{ query|urlencode }}{% endif %}">Next</a>{% endif %}</div></nav>{% endif %}
