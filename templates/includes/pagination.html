{% if is_paginated %}<nav aria-label="Pagination" class="d-flex align-items-center justify-content-between mt-3"><span class="small text-secondary">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page_obj.previous_page_number }}&amp;q={{ query|urlencode }}">Previous</a>{% endif %} {% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page_obj.next_page_number }}&amp;q={{ query|urlencode }}">Next</a>{% endif %}</div></nav>{% endif %}
