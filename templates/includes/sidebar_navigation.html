{% load static %}
<nav aria-label="Main navigation" class="sidebar-nav">
  {% for group in navigation_groups %}
    {% if group.direct %}
      {% include 'includes/navigation_link.html' with link=group.links.0 %}
    {% else %}
      <details class="nav-group {% if group.active %}nav-group-active{% endif %}" data-nav-group data-nav-label="{{ group.label }}" {% if group.active %}open{% endif %}>
        <summary class="nav-group-toggle" title="{{ group.label }}" aria-label="{{ group.label }}" {% if group.active %}aria-current="true"{% endif %}>
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="{% static 'icons/campusload.svg' %}#{{ group.icon }}"></use></svg>
          <span class="nav-group-label">{{ group.label }}</span><span class="nav-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="nav-group-links">
          {% for link in group.links %}{% include 'includes/navigation_link.html' %}{% endfor %}
        </div>
      </details>
    {% endif %}
  {% endfor %}
</nav>
